<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="100%" height="100%">
  <defs>
    <radialGradient id="badgeBg" cx="50%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="dino" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="35%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="tie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b9d"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>
    <linearGradient id="kidTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="clientTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="shadow3d" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Left Mascot Badge (Scaled from 512x512 icon) -->
  <g transform="translate(14, 14) scale(0.375)">
    <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#badgeBg)"/>
    <rect x="14" y="14" width="484" height="484" rx="106" fill="none" stroke="url(#rim)" stroke-width="10"/>

    <!-- Tiny Dino Boss inside badge -->
    <g filter="url(#shadow3d)">
      <!-- Spikes -->
      <path d="M148 118 C120 105, 114 138, 138 150 Z" fill="url(#gold)"/>
      <path d="M132 162 C100 155, 98 190, 126 198 Z" fill="url(#gold)"/>
      <path d="M210 82 C198 52, 236 48, 242 78 Z" fill="url(#gold)"/>
      <!-- Headset Arch -->
      <path d="M134 190 C130 74, 362 74, 368 192" fill="none" stroke="#38bdf8" stroke-width="22" stroke-linecap="round"/>
      <!-- Body & Belly -->
      <path d="M146 270 C132 340, 148 430, 186 456 L326 456 C362 430, 376 340, 358 270 Z" fill="url(#dino)"/>
      <path d="M188 286 C178 345, 188 422, 212 452 L302 452 C324 422, 334 345, 322 286 Z" fill="url(#gold)"/>
      <!-- Head & Snout -->
      <path d="M136 178 C136 100, 202 72, 266 76 C336 80, 378 118, 378 182 C378 210, 394 218, 392 246 C390 284, 344 304, 262 304 C180 304, 136 274, 136 218 Z" fill="url(#dino)"/>
      <!-- Smile & Teeth -->
      <path d="M198 252 Q272 292 356 248" fill="none" stroke="#052e16" stroke-width="9" stroke-linecap="round"/>
      <polygon points="224,262 234,280 244,265" fill="#ffffff"/>
      <polygon points="266,268 276,286 286,269" fill="#ffffff"/>
      <!-- Glasses & Eyes -->
      <rect x="156" y="128" width="100" height="78" rx="24" fill="#0ea5e9" fill-opacity="0.3" stroke="url(#gold)" stroke-width="14"/>
      <rect x="272" y="128" width="100" height="78" rx="24" fill="#0ea5e9" fill-opacity="0.3" stroke="url(#gold)" stroke-width="14"/>
      <path d="M254 162 Q264 154 274 162" fill="none" stroke="url(#gold)" stroke-width="14" stroke-linecap="round"/>
      <circle cx="208" cy="167" r="22" fill="#ffffff"/>
      <circle cx="320" cy="167" r="22" fill="#ffffff"/>
      <circle cx="214" cy="167" r="13" fill="#0f172a"/>
      <circle cx="326" cy="167" r="13" fill="#0f172a"/>
      <circle cx="208" cy="160" r="5" fill="#ffffff"/>
      <circle cx="320" cy="160" r="5" fill="#ffffff"/>
      <!-- Headset Earcup & Mic -->
      <rect x="96" y="166" width="36" height="66" rx="18" fill="#0284c7" stroke="#38bdf8" stroke-width="4"/>
      <path d="M114 226 C114 268, 152 284, 196 278" fill="none" stroke="#38bdf8" stroke-width="9" stroke-linecap="round"/>
      <ellipse cx="202" cy="277" rx="14" ry="10" fill="url(#tie)"/>
      <!-- Boss Tie -->
      <polygon points="242,302 270,302 264,324 248,324" fill="url(#tie)"/>
      <polygon points="248,322 264,322 274,382 256,402 238,382" fill="url(#tie)"/>
      <!-- Gamepad -->
      <rect x="154" y="362" width="204" height="88" rx="42" fill="#4f46e5" stroke="#a5b4fc" stroke-width="5"/>
      <circle cx="322" cy="392" r="10" fill="#ec4899"/>
      <circle cx="300" cy="410" r="10" fill="#38bdf8"/>
      <circle cx="322" cy="424" r="10" fill="#facc15"/>
      <rect x="184" y="388" width="14" height="36" rx="4" fill="#facc15"/>
      <rect x="173" y="399" width="36" height="14" rx="4" fill="#facc15"/>
    </g>
  </g>

  <!-- Right 3D Toy-Block Wordmark & Tagline -->
  <g transform="translate(232, 0)">
    <!-- 3D Extrusion Shadow for Wordmark -->
    <text x="4" y="128" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="104" font-weight="900" letter-spacing="-3" fill="#020617" opacity="0.65">KidClient</text>

    <!-- Main 3D Wordmark -->
    <text x="0" y="120" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="104" font-weight="900" letter-spacing="-3" filter="url(#shadow3d)">
      <tspan fill="url(#kidTextGrad)">Kid</tspan><tspan fill="url(#clientTextGrad)">Client</tspan>
    </text>

    <!-- Playful Crown / Spark above the 'i' in Kid -->
    <path d="M108 16 L114 30 L128 34 L114 38 L108 52 L102 38 L88 34 L102 30 Z" fill="url(#gold)"/>

    <!-- Subtitle Pill Badge -->
    <rect x="4" y="144" width="548" height="44" rx="22" fill="#1e293b" stroke="url(#rim)" stroke-width="2.5"/>
    <text x="278" y="172" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" letter-spacing="2.2" fill="#f8fafc">
      TINY CREATIVE DIRECTOR • AI GAME STUDIO
    </text>
  </g>
</svg>
