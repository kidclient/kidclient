<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- App Icon Squircle Background -->
    <radialGradient id="bgGrad" cx="50%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="65%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </radialGradient>

    <!-- Glowing Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Ambient Backlight Glow -->
    <radialGradient id="auraGrad" cx="50%" cy="48%" r="44%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#a855f7" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D Dino Emerald Skin -->
    <linearGradient id="dinoSkin" x1="25%" y1="5%" x2="80%" y2="95%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="28%" stop-color="#22c55e"/>
      <stop offset="78%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>

    <!-- Dino Snout 3D Highlight -->
    <linearGradient id="snoutGrad" x1="20%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="35%" stop-color="#4ade80"/>
      <stop offset="85%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Dino Belly Cream/Gold -->
    <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="55%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- Sunny Gold Spikes & Glasses Frame -->
    <linearGradient id="gold3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="85%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <!-- Boss Tie Gradient (Arcade Hot Pink / Red) -->
    <linearGradient id="tieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b9d"/>
      <stop offset="45%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>

    <!-- Headset Cyan/Indigo 3D -->
    <linearGradient id="headsetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <!-- Gamepad Body (3D Toy Indigo/Purple) -->
    <linearGradient id="padGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="45%" stop-color="#4f46e5"/>
      <stop offset="90%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Soft 3D Drop Shadow -->
    <filter id="drop3D" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#020617" flood-opacity="0.6"/>
    </filter>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bgGrad)"/>
  <rect x="14" y="14" width="484" height="484" rx="106" fill="none" stroke="url(#rimGrad)" stroke-width="8" opacity="0.9"/>

  <!-- Inner Studio Aura -->
  <circle cx="256" cy="248" r="210" fill="url(#auraGrad)"/>

  <!-- Background Floating Toy Stars & Pixel Cubes -->
  <g opacity="0.85">
    <!-- Top Left Pixel Block -->
    <rect x="64" y="96" width="24" height="24" rx="6" transform="rotate(-18 76 108)" fill="#ec4899"/>
    <rect x="68" y="99" width="16" height="6" rx="3" transform="rotate(-18 76 108)" fill="#fbcfe8" opacity="0.7"/>
    <!-- Top Right Star Spark -->
    <path d="M430 82 L437 102 L457 109 L437 116 L430 136 L423 116 L403 109 L423 102 Z" fill="url(#gold3D)"/>
    <!-- Bottom Left Spark -->
    <circle cx="72" cy="340" r="9" fill="#38bdf8"/>
    <circle cx="442" cy="320" r="11" fill="#a855f7"/>
  </g>

  <!-- MAIN TINY DINO BOSS CHARACTER -->
  <g filter="url(#drop3D)">
    <!-- 3D Crest Spikes (Left side of head) -->
    <path d="M148 118 C120 105, 114 138, 138 150 Z" fill="url(#gold3D)"/>
    <path d="M132 162 C100 155, 98 190, 126 198 Z" fill="url(#gold3D)"/>
    <path d="M126 212 C98 210, 98 242, 128 246 Z" fill="url(#gold3D)"/>
    <!-- Top Crown Spike -->
    <path d="M210 82 C198 52, 236 48, 242 78 Z" fill="url(#gold3D)"/>

    <!-- Headset Top Band (Arching over Dino Head) -->
    <path d="M134 190 C130 74, 362 74, 368 192" fill="none" stroke="url(#headsetGrad)" stroke-width="22" stroke-linecap="round"/>
    <path d="M142 175 C144 86, 350 86, 358 175" fill="none" stroke="#bae6fd" stroke-width="5" stroke-linecap="round" opacity="0.65"/>

    <!-- Dino Torso / Lower Body -->
    <path d="M146 270 C132 340, 148 430, 186 456 L326 456 C362 430, 376 340, 358 270 Z" fill="url(#dinoSkin)"/>

    <!-- Dino Cream/Gold Plated Belly -->
    <path d="M188 286 C178 345, 188 422, 212 452 L302 452 C324 422, 334 345, 322 286 Z" fill="url(#bellyGrad)"/>
    <!-- Belly Ridges -->
    <path d="M192 332 Q256 346 318 332" fill="none" stroke="#ca8a04" stroke-width="4" opacity="0.45" stroke-linecap="round"/>
    <path d="M190 374 Q256 388 320 374" fill="none" stroke="#ca8a04" stroke-width="4" opacity="0.45" stroke-linecap="round"/>

    <!-- Dino Head (Chunky Rounded 3D T-Rex) -->
    <path d="M136 178 C136 100, 202 72, 266 76 C336 80, 378 118, 378 182 C378 210, 394 218, 392 246 C390 284, 344 304, 262 304 C180 304, 136 274, 136 218 Z" fill="url(#dinoSkin)"/>

    <!-- Chubby Snout / Upper Jaw 3D Volume -->
    <ellipse cx="272" cy="238" rx="116" ry="56" fill="url(#snoutGrad)"/>
    <!-- Specular Toy Gloss on Forehead -->
    <ellipse cx="235" cy="108" rx="52" ry="16" transform="rotate(-8 235 108)" fill="#ffffff" opacity="0.32"/>

    <!-- Cute Dino Nostrils -->
    <ellipse cx="322" cy="214" rx="7" ry="9" transform="rotate(-15 322 214)" fill="#14532d"/>
    <ellipse cx="354" cy="218" rx="6" ry="8" transform="rotate(10 354 218)" fill="#14532d"/>

    <!-- Big Joyful Creative Director Smile & Little Dino Teeth -->
    <path d="M198 252 Q272 292 356 248" fill="none" stroke="#052e16" stroke-width="8" stroke-linecap="round"/>
    <!-- Cute White Triangle Teeth -->
    <polygon points="222,261 232,279 242,265" fill="#ffffff"/>
    <polygon points="262,268 272,286 282,269" fill="#ffffff"/>
    <polygon points="304,266 314,282 324,262" fill="#ffffff"/>

    <!-- Rosy Toy Cheeks -->
    <ellipse cx="176" cy="236" rx="18" ry="11" fill="#fb7185" opacity="0.55"/>

    <!-- OVERSIZED "TINY BOSS" CREATIVE DIRECTOR GLASSES -->
    <g filter="url(#softShadow)">
      <!-- Left & Right Lens Background (Tinted Cyan Glass) -->
      <rect x="158" y="130" width="96" height="74" rx="22" fill="#0ea5e9" fill-opacity="0.28"/>
      <rect x="274" y="130" width="96" height="74" rx="22" fill="#0ea5e9" fill-opacity="0.28"/>

      <!-- Big Expressive Eyes Inside Glasses -->
      <circle cx="208" cy="167" r="24" fill="#ffffff"/>
      <circle cx="320" cy="167" r="24" fill="#ffffff"/>
      <circle cx="214" cy="167" r="14" fill="#0f172a"/>
      <circle cx="326" cy="167" r="14" fill="#0f172a"/>
      <!-- Big Pixar Eye Catchlights -->
      <circle cx="208" cy="160" r="6" fill="#ffffff"/>
      <circle cx="220" cy="173" r="3" fill="#ffffff"/>
      <circle cx="320" cy="160" r="6" fill="#ffffff"/>
      <circle cx="332" cy="173" r="3" fill="#ffffff"/>

      <!-- Lens Specular Sheen -->
      <path d="M172 140 L195 140 L178 192 L164 192 Z" fill="#ffffff" opacity="0.35"/>
      <path d="M288 140 L311 140 L294 192 L280 192 Z" fill="#ffffff" opacity="0.35"/>

      <!-- Chunky Yellow/Gold 3D Glasses Frames -->
      <rect x="156" y="128" width="100" height="78" rx="24" fill="none" stroke="url(#gold3D)" stroke-width="14"/>
      <rect x="272" y="128" width="100" height="78" rx="24" fill="none" stroke="url(#gold3D)" stroke-width="14"/>
      <!-- Bridge & Temple Arms -->
      <path d="M254 162 Q264 154 274 162" fill="none" stroke="url(#gold3D)" stroke-width="14" stroke-linecap="round"/>
      <path d="M132 162 L156 162" stroke="url(#gold3D)" stroke-width="12" stroke-linecap="round"/>
      <!-- Frame Top Gloss -->
      <path d="M174 128 L236 128" stroke="#fef9c3" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
      <path d="M290 128 L352 128" stroke="#fef9c3" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- Eyebrows (Excited Creative Director Expression) -->
    <path d="M172 112 Q206 98 238 114" fill="none" stroke="#14532d" stroke-width="9" stroke-linecap="round"/>
    <path d="M292 114 Q324 98 354 112" fill="none" stroke="#14532d" stroke-width="9" stroke-linecap="round"/>

    <!-- LEFT HEADSET EARCUP & GLOWING BOOM MIC -->
    <g filter="url(#softShadow)">
      <!-- Ear Cushion -->
      <rect x="112" y="160" width="32" height="76" rx="16" fill="#0f172a"/>
      <!-- Outer 3D Cyan Earcup -->
      <rect x="96" y="166" width="34" height="64" rx="17" fill="url(#headsetGrad)" stroke="#38bdf8" stroke-width="3"/>
      <circle cx="113" cy="198" r="8" fill="#38bdf8"/>
      <!-- Boom Mic Arm -->
      <path d="M114 226 C114 268, 152 284, 196 278" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
      <!-- Glowing Pink Mic Pop Filter -->
      <ellipse cx="202" cy="277" rx="14" ry="10" fill="url(#tieGrad)" stroke="#fbcfe8" stroke-width="2"/>
    </g>

    <!-- TINY BOSS CLIP-ON POWER TIE -->
    <g filter="url(#softShadow)">
      <!-- White Shirt Collar Wings -->
      <polygon points="222,298 256,316 234,330" fill="#f8fafc"/>
      <polygon points="290,298 256,316 278,330" fill="#e2e8f0"/>
      <!-- Tie Knot -->
      <polygon points="242,302 270,302 264,324 248,324" rx="4" fill="url(#tieGrad)"/>
      <!-- Tie Blade -->
      <polygon points="248,322 264,322 274,382 256,402 238,382" fill="url(#tieGrad)"/>
      <!-- Diagonal Gold Stripes on Tie -->
      <line x1="245" y1="342" x2="267" y2="334" stroke="#facc15" stroke-width="5" stroke-linecap="round"/>
      <line x1="242" y1="366" x2="270" y2="356" stroke="#facc15" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- CHUNKY 3D ARCADE GAMEPAD HELD BY TINY DINO ARMS -->
    <g filter="url(#softShadow)">
      <!-- Gamepad Body -->
      <path d="M148 392 C148 358, 184 352, 216 356 L296 356 C328 352, 364 358, 364 392 C368 432, 348 468, 320 464 C302 462, 294 438, 276 438 L236 438 C218 438, 210 462, 192 464 C164 468, 144 432, 148 392 Z" fill="url(#padGrad)" stroke="#a5b4fc" stroke-width="4"/>

      <!-- Gamepad Top Rim Highlight -->
      <path d="M182 364 L330 364" stroke="#e0e7ff" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

      <!-- Golden D-Pad (Left) -->
      <rect x="184" y="380" width="14" height="38" rx="4" fill="url(#gold3D)"/>
      <rect x="172" y="392" width="38" height="14" rx="4" fill="url(#gold3D)"/>

      <!-- Candy Arcade Action Buttons (Right) -->
      <circle cx="326" cy="386" r="9" fill="#ec4899"/>
      <circle cx="304" cy="402" r="9" fill="#38bdf8"/>
      <circle cx="326" cy="414" r="9" fill="#facc15"/>
      <circle cx="344" cy="400" r="9" fill="#22c55e"/>

      <!-- Center Glowing AI Spark Button -->
      <circle cx="256" cy="396" r="13" fill="#38bdf8" stroke="#ffffff" stroke-width="3"/>
      <path d="M256 386 L259 393 L266 396 L259 399 L256 406 L253 399 L246 396 L253 393 Z" fill="#ffffff"/>
    </g>

    <!-- Cute Stubby Dino Hands Gripping the Controller -->
    <g filter="url(#softShadow)">
      <!-- Left Dino Hand -->
      <ellipse cx="148" cy="402" rx="26" ry="20" transform="rotate(18 148 402)" fill="url(#snoutGrad)"/>
      <circle cx="168" cy="396" r="5" fill="#fef08a"/>
      <circle cx="166" cy="410" r="5" fill="#fef08a"/>
      <!-- Right Dino Hand -->
      <ellipse cx="364" cy="402" rx="26" ry="20" transform="rotate(-18 364 402)" fill="url(#snoutGrad)"/>
      <circle cx="344" cy="396" r="5" fill="#fef08a"/>
      <circle cx="346" cy="410" r="5" fill="#fef08a"/>
    </g>
  </g>
</svg>
