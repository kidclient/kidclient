<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet" />
  <title>Path C: Clay Studio Sticker Mat | KidClient Toybox</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: #FCF8EB; font-family: 'Fredoka', system-ui, sans-serif;
      touch-action: none; user-select: none; -webkit-user-select: none; overscroll-behavior: none;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #topbar {
      position: fixed; top: 14px; left: 14px; right: 14px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 10; pointer-events: none; flex-wrap: wrap; gap: 10px;
    }
    .pill {
      pointer-events: auto;
      background: #FFFDF6; color: #3B3026;
      padding: 9px 18px; border-radius: 20px; border: none;
      font-family: 'Fredoka', sans-serif; font-size: 16px; font-weight: 700;
      text-decoration: none;
      box-shadow: 0 5px 0 #DFD2B8, 0 8px 18px rgba(74, 56, 38, 0.14);
      cursor: pointer; display: flex; align-items: center; gap: 9px;
    }
    .pill img { width: 30px; height: 30px; border-radius: 10px; object-fit: cover; }
    .pill-story { background: #E05A47; color: #FFFDF6; box-shadow: 0 5px 0 #B94232; }
    .pill-clear { background: #F5C84C; box-shadow: 0 5px 0 #D2A024; }

    #sticker-bar {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 12px; background: #FFFDF6;
      padding: 12px 18px; border-radius: 28px; z-index: 20;
      box-shadow: 0 8px 0 #DFD2B8, 0 18px 36px rgba(74, 56, 38, 0.2);
    }
    .sticker-btn {
      width: 66px; height: 66px; border-radius: 18px; border: 3px solid #EDE3CF;
      font-size: 34px; background: #FCF8EB; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.12s, border-color 0.12s; overflow: hidden; padding: 0;
    }
    .sticker-btn img { width: 100%; height: 100%; object-fit: cover; }
    .sticker-btn.active {
      transform: translateY(-6px) scale(1.1);
      border-color: #E05A47;
      background: #F5C84C;
      box-shadow: 0 6px 0 #D2A024;
    }
  </style>
</head>
<body>
  <div id="topbar">
    <a href="/" class="pill">
      <img src="/assets/brand/clay-dino-avatar.jpg" alt="KidClient" />
      <span>Toybox Home</span>
    </a>
    <button class="pill pill-story" id="btn-story">🗣️ Read My Story!</button>
    <button class="pill pill-clear" id="btn-clear">🧹 Fresh Paper</button>
  </div>

  <canvas id="board"></canvas>
  <div id="sticker-bar"></div>

  <script src="/shared/kidclient-shell.js"></script>
  <script>
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    let W = (canvas.width = window.innerWidth);
    let H = (canvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    });

    const clayDino = new Image();
    clayDino.src = '/assets/brand/clay-dino-avatar.jpg';
    const clayTruck = new Image();
    clayTruck.src = '/assets/brand/clay-truck-sketch.jpg';

    const catalog = [
      { type: 'img', img: clayDino, thumb: '/assets/brand/clay-dino-avatar.jpg', name: 'Clay Dino Boss', sound: 'Roar! I am the Clay Dino Creative Director!' },
      { type: 'img', img: clayTruck, thumb: '/assets/brand/clay-truck-sketch.jpg', name: 'Clay Monster Truck', sound: 'Vroom vroom! Monster truck rolling off the paper!' },
      { type: 'emoji', emoji: '🚀', name: 'Toy Rocket Ship', sound: 'Three, two, one, blast off!' },
      { type: 'emoji', emoji: '🍦', name: 'Giant Ice Cream', sound: 'Yummy giant ice cream cone!' },
      { type: 'emoji', emoji: '🥞', name: 'Flying Pancake', sound: 'Silly pancake blast!' },
      { type: 'emoji', emoji: '🌈', name: 'Rainbow Crayon', sound: 'Rainbow crayon!' }
    ];

    let selected = catalog[0];
    const placedStickers = [];
    const bar = document.getElementById('sticker-bar');

    catalog.forEach((item, idx) => {
      const btn = document.createElement('button');
      btn.className = 'sticker-btn' + (idx === 0 ? ' active' : '');
      if (item.type === 'img') {
        const im = document.createElement('img');
        im.src = item.thumb; im.alt = item.name;
        btn.appendChild(im);
      } else {
        btn.textContent = item.emoji;
      }
      btn.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.sticker-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        selected = item;
        KidShell.sfx.coin();
        KidShell.say(item.name);
      });
      bar.appendChild(btn);
    });

    function stamp(x, y) {
      placedStickers.push({ x, y, item: selected, scale: 0.2, wobble: Math.random() * Math.PI * 2 });
      KidShell.sfx.boing();
    }

    let drawing = false;
    canvas.addEventListener('pointerdown', (e) => {
      drawing = true;
      stamp(e.clientX, e.clientY);
      KidShell.say(selected.sound);
    });
    canvas.addEventListener('pointermove', (e) => {
      if (drawing && selected.emoji === '🌈') stamp(e.clientX, e.clientY);
    });
    window.addEventListener('pointerup', () => { drawing = false; });

    document.getElementById('btn-clear').addEventListener('pointerdown', () => {
      placedStickers.length = 0;
      KidShell.sfx.silly();
      KidShell.say('Fresh craft paper! Ready to build a story!');
    });

    document.getElementById('btn-story').addEventListener('pointerdown', () => {
      if (placedStickers.length === 0) {
        KidShell.say('Tap the craft mat to place Clay Dino or Monster Truck first!');
        return;
      }
      const uniqueNames = [...new Set(placedStickers.map((s) => s.item.name))];
      const story = `Once upon a time in the Toybox Studio, the ${uniqueNames.join(' and the ')} teamed up for a big adventure with ${placedStickers.length} handmade toys! Approved by the four year old!`;
      KidShell.sfx.coin();
      KidShell.say(story);
    });

    let t = 0;
    function render() {
      requestAnimationFrame(render);
      t += 0.06;

      // Warm Cream Craft Mat (Zero harsh grid lines)
      const grad = ctx.createRadialGradient(W / 2, H / 2, 40, W / 2, H / 2, Math.max(W, H) * 0.7);
      grad.addColorStop(0, '#FFFDF6');
      grad.addColorStop(1, '#F2E8D2');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      if (placedStickers.length === 0) {
        ctx.fillStyle = 'rgba(110, 94, 79, 0.45)';
        ctx.font = '700 28px "Fredoka", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Tap anywhere on the craft mat to stamp talking toys!', W / 2, H / 2);
      }

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (const s of placedStickers) {
        if (s.scale < 1) s.scale += (1 - s.scale) * 0.22;
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(Math.sin(t + s.wobble) * 0.07);
        if (s.item.type === 'img' && s.item.img.complete) {
          const r = 48 * s.scale;
          ctx.shadowColor = 'rgba(74, 56, 38, 0.25)';
          ctx.shadowBlur = 14; ctx.shadowOffsetY = 6;
          ctx.beginPath(); ctx.arc(0, 0, r + 4, 0, Math.PI * 2); ctx.fillStyle = '#FFFDF6'; ctx.fill();
          ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
          ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.closePath();
          ctx.save(); ctx.clip();
          ctx.drawImage(s.item.img, -r, -r, r * 2, r * 2);
          ctx.restore();
        } else {
          ctx.font = `${70 * s.scale}px serif`;
          ctx.fillText(s.item.emoji || '⭐', 0, 0);
        }
        ctx.restore();
      }
    }
    render();
  </script>
</body>
</html>
