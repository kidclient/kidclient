<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <title>Path C: Magic Talking Sticker Canvas | KidClient Arcade</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: #0f172a; font-family: system-ui, -apple-system, sans-serif;
      touch-action: none; user-select: none; -webkit-user-select: none; overscroll-behavior: none;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #topbar {
      position: fixed; top: 14px; left: 14px; right: 14px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 10; pointer-events: none; flex-wrap: wrap; gap: 10px;
    }
    .pill {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.9); color: #fff;
      padding: 8px 18px; border-radius: 999px;
      font-size: 19px; font-weight: 800;
      text-decoration: none; border: 3px solid #38bdf8;
      box-shadow: 0 6px 16px rgba(0,0,0,0.3);
      cursor: pointer; display: flex; align-items: center; gap: 10px;
    }
    .pill img { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #facc15; }
    .pill-story {
      background: linear-gradient(135deg, #ec4899, #a855f7);
      border-color: #fff;
    }
    #sticker-bar {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 12px; background: rgba(15, 23, 42, 0.92);
      padding: 12px 20px; border-radius: 999px; z-index: 20;
      border: 3px solid rgba(56, 189, 248, 0.6);
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    }
    .sticker-btn {
      width: 68px; height: 68px; border-radius: 50%;
      font-size: 36px; border: 3px solid rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.12); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s; overflow: hidden; padding: 0;
    }
    .sticker-btn img { width: 100%; height: 100%; object-fit: cover; }
    .sticker-btn.active {
      transform: scale(1.2); border-color: #facc15; background: rgba(250, 204, 21, 0.35);
      box-shadow: 0 0 18px rgba(250, 204, 21, 0.7);
    }
  </style>
</head>
<body>
  <div id="topbar">
    <a href="/" class="pill">
      <img src="/assets/brand/kidclient-avatar.png" alt="KidClient Mascot" />
      <span>Arcade</span>
    </a>
    <button class="pill pill-story" id="btn-story">🗣️ Read My Picture Story!</button>
    <button class="pill" id="btn-clear">🧹 Clear</button>
  </div>

  <canvas id="board"></canvas>

  <div id="sticker-bar"></div>

  <script src="/shared/kidclient-shell.js"></script>
  <script>
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    let W = (canvas.width = window.innerWidth);
    let H = (canvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    });

    const dinoAvatar = new Image();
    dinoAvatar.src = '/assets/brand/kidclient-avatar.png';
    const teamLogo = new Image();
    teamLogo.src = '/assets/brand/kidclient-logo-3d.png';

    const catalog = [
      { type: 'img', img: dinoAvatar, thumb: '/assets/brand/kidclient-avatar.png', name: 'Dino Client Boss', sound: 'Roar! I am the Dino Creative Director! Let us build a game!' },
      { type: 'img', img: teamLogo, thumb: '/assets/brand/kidclient-logo-3d.png', name: 'KidClient High-Five Team', sound: 'High five! Consultant and Tiny Client power!' },
      { type: 'emoji', emoji: '🦈', name: 'Shark Monster Truck', sound: 'Chomp chomp vroom! Shark truck looking for ice cream!' },
      { type: 'emoji', emoji: '🚀', name: 'Rocket Ship', sound: 'Three, two, one, blast off to the stars!' },
      { type: 'emoji', emoji: '🍦', name: 'Giant Ice Cream Cone', sound: 'Yummy double scoop ice cream!' },
      { type: 'emoji', emoji: '🌈', name: 'Magic Rainbow Brush', sound: 'Rainbow magic everywhere!' }
    ];

    let selected = catalog[0];
    const placedStickers = [];
    const bar = document.getElementById('sticker-bar');

    catalog.forEach((item, idx) => {
      const btn = document.createElement('button');
      btn.className = 'sticker-btn' + (idx === 0 ? ' active' : '');
      if (item.type === 'img') {
        const im = document.createElement('img');
        im.src = item.thumb;
        im.alt = item.name;
        btn.appendChild(im);
      } else {
        btn.textContent = item.emoji;
      }
      btn.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.sticker-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        selected = item;
        KidShell.sfx.coin();
        KidShell.say(item.name);
      });
      bar.appendChild(btn);
    });

    function stamp(x, y) {
      placedStickers.push({
        x, y,
        item: selected,
        scale: 0.2,
        wobble: Math.random() * Math.PI * 2
      });
      KidShell.sfx.boing();
    }

    let drawing = false;
    canvas.addEventListener('pointerdown', (e) => {
      drawing = true;
      stamp(e.clientX, e.clientY);
      KidShell.say(selected.sound);
    });
    canvas.addEventListener('pointermove', (e) => {
      if (drawing && selected.emoji === '🌈') {
        stamp(e.clientX, e.clientY);
      }
    });
    window.addEventListener('pointerup', () => { drawing = false; });

    document.getElementById('btn-clear').addEventListener('pointerdown', () => {
      placedStickers.length = 0;
      KidShell.sfx.silly();
      KidShell.say('All clean! Tap the screen to stamp a new story!');
    });

    document.getElementById('btn-story').addEventListener('pointerdown', () => {
      if (placedStickers.length === 0) {
        KidShell.say('Tap the screen to put Dino Boss or Shark Truck into your picture first!');
        return;
      }
      const uniqueNames = [...new Set(placedStickers.map((s) => s.item.name))];
      const story = `Once upon a time in Kid Client Studio, the ${uniqueNames.join(' and the ')} teamed up for a giant adventure with ${placedStickers.length} awesome stickers!`;
      KidShell.sfx.coin();
      KidShell.say(story);
    });

    let t = 0;
    function render() {
      requestAnimationFrame(render);
      t += 0.06;

      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, '#1e1b4b');
      grad.addColorStop(1, '#0f172a');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (const s of placedStickers) {
        if (s.scale < 1) s.scale += (1 - s.scale) * 0.22;
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(Math.sin(t + s.wobble) * 0.08);
        if (s.item.type === 'img' && s.item.img.complete) {
          const r = 46 * s.scale;
          ctx.beginPath();
          ctx.arc(0, 0, r, 0, Math.PI * 2);
          ctx.closePath();
          ctx.save();
          ctx.clip();
          ctx.drawImage(s.item.img, -r, -r, r * 2, r * 2);
          ctx.restore();
          ctx.lineWidth = 4;
          ctx.strokeStyle = '#facc15';
          ctx.stroke();
        } else {
          const size = 72 * s.scale;
          ctx.font = `${size}px serif`;
          ctx.fillText(s.item.emoji || '⭐', 0, 0);
        }
        ctx.restore();
      }
    }
    render();
  </script>
</body>
</html>
