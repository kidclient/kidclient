<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=JetBrains+Mono:wght@700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet" />
  <title>Brief #03: Talking Sticker Sketchpad | KidClient</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: #F7F5EE; font-family: 'Space Grotesk', system-ui, sans-serif;
      touch-action: none; user-select: none; -webkit-user-select: none; overscroll-behavior: none;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #topbar {
      position: fixed; top: 14px; left: 14px; right: 14px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 10; pointer-events: none; flex-wrap: wrap; gap: 10px;
    }
    .pill {
      pointer-events: auto;
      background: #F7F5EE; color: #1C1E21;
      padding: 8px 16px; border-radius: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px; font-weight: 800;
      text-decoration: none; border: 2.5px solid #1C1E21;
      box-shadow: 4px 4px 0 #1C1E21;
      cursor: pointer; display: flex; align-items: center; gap: 9px;
    }
    .pill img { width: 30px; height: 30px; border-radius: 8px; border: 2px solid #1C1E21; object-fit: cover; }
    .pill-story { background: #1546F6; color: #fff; }
    .pill-clear { background: #F6C945; }

    #sticker-bar {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 12px; background: #fff;
      padding: 12px 18px; border-radius: 24px; z-index: 20;
      border: 3px solid #1C1E21;
      box-shadow: 6px 6px 0 #1C1E21;
    }
    .sticker-btn {
      width: 66px; height: 66px; border-radius: 16px;
      font-size: 34px; border: 2.5px solid #1C1E21;
      background: #F7F5EE; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.12s, background 0.12s; overflow: hidden; padding: 0;
    }
    .sticker-btn img { width: 100%; height: 100%; object-fit: cover; }
    .sticker-btn.active {
      transform: translateY(-6px) scale(1.1);
      background: #F6C945;
      box-shadow: 4px 4px 0 #1C1E21;
    }
  </style>
</head>
<body>
  <div id="topbar">
    <a href="/" class="pill">
      <img src="/assets/brand/clay-dino-avatar.jpg" alt="KidClient" />
      <span>ARCADE</span>
    </a>
    <button class="pill pill-story" id="btn-story">🗣️ READ MY STORY</button>
    <button class="pill pill-clear" id="btn-clear">🧹 NEW PAPER</button>
  </div>

  <canvas id="board"></canvas>
  <div id="sticker-bar"></div>

  <script src="/shared/kidclient-shell.js"></script>
  <script>
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    let W = (canvas.width = window.innerWidth);
    let H = (canvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    });

    const clayDino = new Image();
    clayDino.src = '/assets/brand/clay-dino-avatar.jpg';
    const crayonShark = new Image();
    crayonShark.src = '/assets/brand/crayon-shark-truck.jpg';

    const catalog = [
      { type: 'img', img: clayDino, thumb: '/assets/brand/clay-dino-avatar.jpg', name: 'Clay Dino Boss', sound: 'Roar! I am the four year old boss! Put more stickers!' },
      { type: 'img', img: crayonShark, thumb: '/assets/brand/crayon-shark-truck.jpg', name: 'Crayon Shark Truck', sound: 'Vroom chomp! Shark monster truck on a rainbow ramp!' },
      { type: 'emoji', emoji: '🚀', name: 'Rocket Ship', sound: 'Three, two, one, blast off!' },
      { type: 'emoji', emoji: '🍦', name: 'Giant Ice Cream', sound: 'Yummy giant ice cream cone!' },
      { type: 'emoji', emoji: '🥞', name: 'Flying Pancake', sound: 'Silly pancake blast!' },
      { type: 'emoji', emoji: '🌈', name: 'Rainbow Crayon', sound: 'Rainbow crayon!' }
    ];

    let selected = catalog[0];
    const placedStickers = [];
    const bar = document.getElementById('sticker-bar');

    catalog.forEach((item, idx) => {
      const btn = document.createElement('button');
      btn.className = 'sticker-btn' + (idx === 0 ? ' active' : '');
      if (item.type === 'img') {
        const im = document.createElement('img');
        im.src = item.thumb; im.alt = item.name;
        btn.appendChild(im);
      } else {
        btn.textContent = item.emoji;
      }
      btn.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.sticker-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        selected = item;
        KidShell.sfx.coin();
        KidShell.say(item.name);
      });
      bar.appendChild(btn);
    });

    function stamp(x, y) {
      placedStickers.push({ x, y, item: selected, scale: 0.2, wobble: Math.random() * Math.PI * 2 });
      KidShell.sfx.boing();
    }

    let drawing = false;
    canvas.addEventListener('pointerdown', (e) => {
      drawing = true;
      stamp(e.clientX, e.clientY);
      KidShell.say(selected.sound);
    });
    canvas.addEventListener('pointermove', (e) => {
      if (drawing && selected.emoji === '🌈') stamp(e.clientX, e.clientY);
    });
    window.addEventListener('pointerup', () => { drawing = false; });

    document.getElementById('btn-clear').addEventListener('pointerdown', () => {
      placedStickers.length = 0;
      KidShell.sfx.silly();
      KidShell.say('Fresh graph paper! Ready to draw!');
    });

    document.getElementById('btn-story').addEventListener('pointerdown', () => {
      if (placedStickers.length === 0) {
        KidShell.say('Tap the paper to stamp Clay Dino or Shark Truck first!');
        return;
      }
      const uniqueNames = [...new Set(placedStickers.map((s) => s.item.name))];
      const story = `Once upon a time on our drafting table, the ${uniqueNames.join(' and the ')} teamed up for a giant adventure with ${placedStickers.length} awesome stickers! Approved by the four year old!`;
      KidShell.sfx.coin();
      KidShell.say(story);
    });

    let t = 0;
    function render() {
      requestAnimationFrame(render);
      t += 0.06;

      // Crisp Swiss Graph Paper Canvas
      ctx.fillStyle = '#F7F5EE';
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(28, 30, 33, 0.08)';
      ctx.lineWidth = 1;
      for (let x = 0; x < W; x += 32) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      }
      for (let y = 0; y < H; y += 32) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }

      if (placedStickers.length === 0) {
        ctx.fillStyle = 'rgba(28, 30, 33, 0.28)';
        ctx.font = '700 38px "Caveat", cursive';
        ctx.textAlign = 'center';
        ctx.fillText('Tap anywhere on the drafting paper to stamp talking stickers!', W / 2, H / 2);
      }

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (const s of placedStickers) {
        if (s.scale < 1) s.scale += (1 - s.scale) * 0.22;
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(Math.sin(t + s.wobble) * 0.07);
        if (s.item.type === 'img' && s.item.img.complete) {
          const r = 48 * s.scale;
          ctx.beginPath(); ctx.arc(4, 4, r, 0, Math.PI * 2); ctx.fillStyle = '#1C1E21'; ctx.fill();
          ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.closePath();
          ctx.save(); ctx.clip();
          ctx.drawImage(s.item.img, -r, -r, r * 2, r * 2);
          ctx.restore();
          ctx.lineWidth = 3.5; ctx.strokeStyle = '#1C1E21'; ctx.stroke();
        } else {
          ctx.font = `${70 * s.scale}px serif`;
          ctx.fillText(s.item.emoji || '⭐', 0, 0);
        }
        ctx.restore();
      }
    }
    render();
  </script>
</body>
</html>
