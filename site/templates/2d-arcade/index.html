<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.json" />
  <title>Bouncy Dino Star Party (2D Starter) | KidClient</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: #1e1b4b; font-family: system-ui, -apple-system, sans-serif;
      touch-action: none; user-select: none; -webkit-user-select: none; overscroll-behavior: none;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed; top: 16px; left: 16px; right: 16px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 10; pointer-events: none;
    }
    .pill {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.8); color: #fff;
      padding: 10px 18px; border-radius: 999px;
      font-size: 22px; font-weight: 800;
      border: 3px solid rgba(255,255,255,0.25);
      text-decoration: none;
    }
    #controls {
      position: fixed; bottom: 24px; left: 24px; right: 24px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 20; pointer-events: none;
    }
    .btn-group { display: flex; gap: 16px; pointer-events: auto; }
    .touch-btn {
      width: 88px; height: 88px; border-radius: 50%;
      font-size: 40px; border: 4px solid #fff;
      background: rgba(255,255,255,0.25); backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3); cursor: pointer;
    }
    .touch-btn:active { transform: scale(0.9); }
    .jump-btn { background: linear-gradient(135deg, #22c55e, #16a34a); }
    .silly-btn { background: linear-gradient(135deg, #f59e0b, #d97706); }
  </style>
</head>
<body>
  <div id="hud">
    <a href="/" class="pill">🏠 Arcade</a>
    <div class="pill">⭐ <span id="score">0</span> &nbsp;|&nbsp; 🏆 <span id="best">0</span></div>
  </div>

  <canvas id="game"></canvas>

  <div id="controls">
    <div class="btn-group">
      <button class="touch-btn" id="btn-left">⬅️</button>
      <button class="touch-btn" id="btn-right">➡️</button>
    </div>
    <div class="btn-group">
      <button class="touch-btn silly-btn" id="btn-silly">🎉</button>
      <button class="touch-btn jump-btn" id="btn-jump">🚀</button>
    </div>
  </div>

  <script src="/shared/kidclient-shell.js"></script>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let W = (canvas.width = window.innerWidth);
    let H = (canvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    });

    let score = 0;
    let best = KidShell.load('2d_best_stars', 0);
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    bestEl.textContent = best;

    const dinoEmojis = ['🦖', '🦕', '🦄', '🐸', '🤖', '🦁'];
    let currentEmojiIdx = 0;

    const player = {
      x: W / 2, y: H - 180, vx: 0, vy: 0, size: 78,
      onGround: false
    };

    const stars = [];
    const particles = [];

    function spawnStar() {
      stars.push({
        x: 80 + Math.random() * (W - 160),
        y: 120 + Math.random() * (H - 280),
        size: 48,
        bob: Math.random() * Math.PI * 2
      });
    }
    for (let i = 0; i < 6; i++) spawnStar();

    function burst(x, y, emoji = '✨') {
      for (let i = 0; i < 14; i++) {
        const angle = (Math.PI * 2 * i) / 14;
        const speed = 3 + Math.random() * 6;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 2,
          life: 40,
          emoji
        });
      }
    }

    const input = { left: false, right: false };
    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = true;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = true;
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') jump();
      if (e.code === 'KeyE' || e.code === 'Enter') sillyParty();
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = false;
    });

    const bindHold = (id, key) => {
      const el = document.getElementById(id);
      el.addEventListener('pointerdown', (e) => { e.preventDefault(); input[key] = true; });
      el.addEventListener('pointerup', () => { input[key] = false; });
      el.addEventListener('pointerleave', () => { input[key] = false; });
    };
    bindHold('btn-left', 'left');
    bindHold('btn-right', 'right');

    function jump() {
      player.vy = -17;
      KidShell.sfx.boing();
      burst(player.x, player.y + 30, '💨');
    }

    function sillyParty() {
      currentEmojiIdx = (currentEmojiIdx + 1) % dinoEmojis.length;
      player.vy = -14;
      KidShell.sfx.silly();
      burst(player.x, player.y, '🌈');
      KidShell.say('Costume change!');
    }

    document.getElementById('btn-jump').addEventListener('pointerdown', (e) => { e.preventDefault(); jump(); });
    document.getElementById('btn-silly').addEventListener('pointerdown', (e) => { e.preventDefault(); sillyParty(); });

    let t = 0;
    function loop() {
      requestAnimationFrame(loop);
      t += 0.06;

      // Sky gradient
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, '#38bdf8');
      grad.addColorStop(1, '#bae6fd');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      // Bouncy Trampoline Ground
      const groundY = H - 90;
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(0, groundY, W, 90);
      ctx.fillStyle = '#4ade80';
      ctx.fillRect(0, groundY, W, 16);

      // Move Player
      if (input.left) player.vx = -8.5;
      else if (input.right) player.vx = 8.5;
      else player.vx *= 0.82;

      player.x += player.vx;
      player.vy += 0.65;
      player.y += player.vy;

      // Wrap walls so the kid never gets stuck
      if (player.x < 40) player.x = 40;
      if (player.x > W - 40) player.x = W - 40;

      // Ground bounce
      if (player.y > groundY - 40) {
        player.y = groundY - 40;
        player.vy = 0;
      }

      // Draw & Collect Stars
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let i = stars.length - 1; i >= 0; i--) {
        const s = stars[i];
        const sy = s.y + Math.sin(t + s.bob) * 10;
        ctx.font = `${s.size}px serif`;
        ctx.fillText('⭐', s.x, sy);

        if (Math.hypot(player.x - s.x, player.y - sy) < 75) {
          stars.splice(i, 1);
          score++;
          scoreEl.textContent = score;
          KidShell.sfx.coin();
          burst(s.x, sy, '🌟');
          if (score > best) {
            best = score;
            bestEl.textContent = best;
            KidShell.save('2d_best_stars', best);
          }
          if (score % 5 === 0) {
            KidShell.say(`${score} stars! Super jumper!`);
          }
          spawnStar();
        }
      }

      // Draw Hero
      ctx.font = `${player.size}px serif`;
      ctx.fillText(dinoEmojis[currentEmojiIdx], player.x, player.y);

      // Draw Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        ctx.globalAlpha = Math.max(0, p.life / 40);
        ctx.font = '28px serif';
        ctx.fillText(p.emoji, p.x, p.y);
        ctx.globalAlpha = 1;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }
    loop();
  </script>
</body>
</html>
