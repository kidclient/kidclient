<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet" />
  <title>Brief #02: Clay Dino Star Bounce | KidClient</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: #F7F5EE; font-family: 'Space Grotesk', system-ui, sans-serif;
      touch-action: none; user-select: none; -webkit-user-select: none; overscroll-behavior: none;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed; top: 14px; left: 14px; right: 14px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 10; pointer-events: none;
    }
    .pill {
      pointer-events: auto;
      background: #F7F5EE; color: #1C1E21;
      padding: 7px 15px; border-radius: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px; font-weight: 800;
      border: 2.5px solid #1C1E21;
      text-decoration: none; display: flex; align-items: center; gap: 9px;
      box-shadow: 4px 4px 0 #1C1E21;
    }
    .pill img { width: 32px; height: 32px; border-radius: 8px; border: 2px solid #1C1E21; object-fit: cover; }
    #controls {
      position: fixed; bottom: 24px; left: 24px; right: 24px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 20; pointer-events: none;
    }
    .btn-group { display: flex; gap: 14px; align-items: center; pointer-events: auto; }
    .touch-btn {
      width: 88px; height: 88px; border-radius: 22px;
      font-size: 32px; border: 3.5px solid #1C1E21;
      background: #F6C945; color: #1C1E21;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 0 #1C1E21; cursor: pointer;
      font-family: 'JetBrains Mono', monospace; font-weight: 800;
      transition: transform 0.08s, box-shadow 0.08s;
    }
    .touch-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #1C1E21; }
    .jump-btn {
      border-radius: 50%; background: #2E8B57; color: #fff;
      font-size: 13px; flex-direction: column;
    }
    .silly-btn {
      width: 98px; height: 98px; border-radius: 50%;
      background: #F02D2D; color: #fff;
      font-size: 13px; flex-direction: column; line-height: 1.05;
    }
  </style>
</head>
<body>
  <div id="hud">
    <a href="/" class="pill">
      <img src="/assets/brand/clay-dino-avatar.jpg" alt="KidClient" />
      <span>ARCADE</span>
    </a>
    <div class="pill">★ <span id="score">0</span> &nbsp;|&nbsp; BEST <span id="best">0</span></div>
  </div>

  <canvas id="game"></canvas>

  <div id="controls">
    <div class="btn-group">
      <button class="touch-btn" id="btn-left">◀</button>
      <button class="touch-btn" id="btn-right">▶</button>
    </div>
    <div class="btn-group">
      <button class="touch-btn silly-btn" id="btn-silly">
        <span style="font-size:26px">👑</span>
        SILLY<br/>HAT
      </button>
      <button class="touch-btn jump-btn" id="btn-jump">
        <span style="font-size:26px">🚀</span>
        JUMP
      </button>
    </div>
  </div>

  <script src="/shared/kidclient-shell.js"></script>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let W = (canvas.width = window.innerWidth);
    let H = (canvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    });

    const mascotImg = new Image();
    mascotImg.src = '/assets/brand/clay-dino-avatar.jpg';

    let score = 0;
    let best = KidShell.load('2d_best_stars', 0);
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    bestEl.textContent = best;

    const hats = ['', '🤠', '🎩', '🦄', '🦈', '🚀'];
    let hatIdx = 0;
    const player = { x: W / 2, y: H - 220, vx: 0, vy: 0, radius: 52 };

    // Tactile Swiss/Toybox Jump Pads
    const pads = [
      { x: 0.22, y: 0.66, w: 155, color: '#1546F6' },
      { x: 0.5, y: 0.48, w: 170, color: '#E55B4B' },
      { x: 0.78, y: 0.66, w: 155, color: '#F6C945' }
    ];

    const stars = [];
    const particles = [];
    function spawnStar() {
      stars.push({
        x: 90 + Math.random() * (W - 180),
        y: 110 + Math.random() * (H - 310),
        size: 46,
        bob: Math.random() * Math.PI * 2
      });
    }
    for (let i = 0; i < 7; i++) spawnStar();

    function burst(x, y, emoji = '★') {
      for (let i = 0; i < 12; i++) {
        const angle = (Math.PI * 2 * i) / 12;
        const speed = 3 + Math.random() * 5.5;
        particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 2, life: 40, emoji });
      }
    }

    const input = { left: false, right: false };
    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = true;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = true;
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') jump();
      if (e.code === 'KeyE' || e.code === 'Enter') sillyParty();
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = false;
    });

    const bindHold = (id, key) => {
      const el = document.getElementById(id);
      el.addEventListener('pointerdown', (e) => { e.preventDefault(); input[key] = true; });
      el.addEventListener('pointerup', () => { input[key] = false; });
      el.addEventListener('pointerleave', () => { input[key] = false; });
    };
    bindHold('btn-left', 'left');
    bindHold('btn-right', 'right');

    function jump() {
      player.vy = -17.5;
      KidShell.sfx.boing();
      burst(player.x, player.y + 40, '💨');
    }

    function sillyParty() {
      hatIdx = (hatIdx + 1) % hats.length;
      player.vy = -15;
      KidShell.sfx.silly();
      burst(player.x, player.y, '🌈');
      KidShell.say('New silly hat!');
    }

    document.getElementById('btn-jump').addEventListener('pointerdown', (e) => { e.preventDefault(); jump(); });
    document.getElementById('btn-silly').addEventListener('pointerdown', (e) => { e.preventDefault(); sillyParty(); });

    let t = 0;
    function loop() {
      requestAnimationFrame(loop);
      t += 0.06;

      // Warm Swiss Graph Paper Canvas (Hybrid Dir 1 + Dir 2!)
      ctx.fillStyle = '#F7F5EE';
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(28, 30, 33, 0.08)';
      ctx.lineWidth = 1;
      for (let x = 0; x < W; x += 32) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      }
      for (let y = 0; y < H; y += 32) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }

      // Faint Agency Watermark
      ctx.fillStyle = 'rgba(28, 30, 33, 0.06)';
      ctx.font = '800 52px "Space Grotesk", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('BRIEF #02 // CLAY DINO BOUNCE', W / 2, 130);

      // Draw Tactile Wooden Jump Pads with Hard Ink Shadow
      pads.forEach((p) => {
        const px = p.x * W;
        const py = p.y * H;
        ctx.fillStyle = '#1C1E21';
        ctx.beginPath(); ctx.roundRect(px - p.w / 2 + 5, py + 5, p.w, 24, 10); ctx.fill();
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.roundRect(px - p.w / 2, py, p.w, 24, 10); ctx.fill();
        ctx.strokeStyle = '#1C1E21'; ctx.lineWidth = 3; ctx.stroke();

        if (
          player.vy > 0 &&
          player.x > px - p.w / 2 - 20 &&
          player.x < px + p.w / 2 + 20 &&
          player.y + player.radius > py &&
          player.y + player.radius < py + 34
        ) {
          player.vy = -19;
          KidShell.sfx.boing();
          burst(player.x, py, '✨');
        }
      });

      // Warm Forest Green Felt Floor with Bold Ink Border
      const groundY = H - 86;
      ctx.fillStyle = '#5ea373';
      ctx.fillRect(0, groundY, W, 86);
      ctx.fillStyle = '#1C1E21';
      ctx.fillRect(0, groundY, W, 4);

      if (input.left) player.vx = -9;
      else if (input.right) player.vx = 9;
      else player.vx *= 0.84;

      player.x += player.vx;
      player.vy += 0.65;
      player.y += player.vy;

      if (player.x < 55) player.x = 55;
      if (player.x > W - 55) player.x = W - 55;
      if (player.y > groundY - player.radius) {
        player.y = groundY - player.radius;
        player.vy = 0;
      }

      // Gold Foil Star Stickers
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let i = stars.length - 1; i >= 0; i--) {
        const s = stars[i];
        const sy = s.y + Math.sin(t + s.bob) * 10;
        ctx.font = `${s.size}px serif`;
        ctx.fillText('⭐', s.x, sy);

        if (Math.hypot(player.x - s.x, player.y - sy) < 82) {
          stars.splice(i, 1);
          score++;
          scoreEl.textContent = score;
          KidShell.sfx.coin();
          burst(s.x, sy, '🌟');
          if (score > best) {
            best = score;
            bestEl.textContent = best;
            KidShell.save('2d_best_stars', best);
          }
          if (score % 5 === 0) KidShell.say(`${score} stars! Approved by the 4 year old!`);
          spawnStar();
        }
      }

      // Playable Clay Dino Sticker Token with Hard Shadow
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(player.vx * 0.025);
      ctx.beginPath();
      ctx.arc(5, 5, player.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#1C1E21';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
      ctx.closePath();
      ctx.save();
      ctx.clip();
      if (mascotImg.complete && mascotImg.naturalWidth > 0) {
        ctx.drawImage(mascotImg, -player.radius, -player.radius, player.radius * 2, player.radius * 2);
      } else {
        ctx.fillStyle = '#F6C945';
        ctx.fill();
      }
      ctx.restore();
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#1C1E21';
      ctx.stroke();

      if (hats[hatIdx]) {
        ctx.font = '44px serif';
        ctx.fillText(hats[hatIdx], 0, -player.radius - 16);
      }
      ctx.restore();

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life--;
        ctx.globalAlpha = Math.max(0, p.life / 40);
        ctx.font = '26px serif';
        ctx.fillText(p.emoji, p.x, p.y);
        ctx.globalAlpha = 1;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }
    loop();
  </script>
</body>
</html>
