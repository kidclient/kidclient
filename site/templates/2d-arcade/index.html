<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet" />
  <title>Path B: Clay Dino Star Bounce | KidClient Toybox</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: #FCF8EB; font-family: 'Fredoka', system-ui, sans-serif;
      touch-action: none; user-select: none; -webkit-user-select: none; overscroll-behavior: none;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed; top: 14px; left: 14px; right: 14px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 10; pointer-events: none;
    }
    .pill {
      pointer-events: auto;
      background: #FFFDF6; color: #3B3026;
      padding: 8px 16px; border-radius: 20px;
      font-size: 18px; font-weight: 700;
      text-decoration: none; display: flex; align-items: center; gap: 9px;
      box-shadow: 0 5px 0 #DFD2B8, 0 8px 18px rgba(74, 56, 38, 0.14);
    }
    .pill img { width: 32px; height: 32px; border-radius: 10px; object-fit: cover; }
    #controls {
      position: fixed; bottom: 24px; left: 24px; right: 24px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 20; pointer-events: none;
    }
    .btn-tray {
      display: flex; gap: 14px; align-items: center; pointer-events: auto;
      background: #F5C84C; padding: 12px 16px; border-radius: 28px;
      box-shadow: 0 8px 0 #D2A024, 0 14px 26px rgba(74, 56, 38, 0.22);
    }
    .touch-btn {
      width: 82px; height: 82px; border-radius: 50%; border: none;
      font-size: 30px; background: #FFFDF6; color: #3B3026;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 0 #DFD2B8; cursor: pointer;
      font-family: 'Fredoka', sans-serif; font-weight: 700;
      transition: transform 0.08s, box-shadow 0.08s;
    }
    .touch-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #DFD2B8; }
    .jump-btn {
      background: #3D7A52; color: #FFFDF6; box-shadow: 0 6px 0 #29593A;
      font-size: 14px; flex-direction: column;
    }
    .jump-btn:active { box-shadow: 0 2px 0 #29593A; }
    .silly-btn {
      width: 90px; height: 90px; background: #E05A47; color: #FFFDF6;
      box-shadow: 0 6px 0 #B94232; font-size: 14px; flex-direction: column; line-height: 1.05;
    }
    .silly-btn:active { box-shadow: 0 2px 0 #B94232; }
  </style>
</head>
<body>
  <div id="hud">
    <a href="/" class="pill">
      <img src="/assets/brand/clay-dino-avatar.jpg" alt="KidClient" />
      <span>Toybox Home</span>
    </a>
    <div class="pill">★ <span id="score">0</span> &nbsp;|&nbsp; Best <span id="best">0</span></div>
  </div>

  <canvas id="game"></canvas>

  <div id="controls">
    <div class="btn-tray">
      <button class="touch-btn" id="btn-left">◀</button>
      <button class="touch-btn" id="btn-right">▶</button>
    </div>
    <div class="btn-tray">
      <button class="touch-btn silly-btn" id="btn-silly">
        <span style="font-size:24px">👑</span>
        Hat!
      </button>
      <button class="touch-btn jump-btn" id="btn-jump">
        <span style="font-size:24px">🚀</span>
        Jump!
      </button>
    </div>
  </div>

  <script src="/shared/kidclient-shell.js"></script>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let W = (canvas.width = window.innerWidth);
    let H = (canvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    });

    const mascotImg = new Image();
    mascotImg.src = '/assets/brand/clay-dino-avatar.jpg';

    let score = 0;
    let best = KidShell.load('2d_best_stars', 0);
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    bestEl.textContent = best;

    const hats = ['', '🤠', '🎩', '🦄', '🦈', '🚀'];
    let hatIdx = 0;
    const player = { x: W / 2, y: H - 220, vx: 0, vy: 0, radius: 52 };

    // Tactile Painted Wooden Blocks (Direction 1 Palette)
    const pads = [
      { x: 0.22, y: 0.66, w: 160, color: '#2A5CA8', deep: '#1E447E' },
      { x: 0.5, y: 0.48, w: 175, color: '#E05A47', deep: '#B94232' },
      { x: 0.78, y: 0.66, w: 160, color: '#F5C84C', deep: '#D2A024' }
    ];

    const stars = [];
    const particles = [];
    function spawnStar() {
      stars.push({
        x: 90 + Math.random() * (W - 180),
        y: 110 + Math.random() * (H - 310),
        size: 46,
        bob: Math.random() * Math.PI * 2
      });
    }
    for (let i = 0; i < 7; i++) spawnStar();

    function burst(x, y, emoji = '✨') {
      for (let i = 0; i < 12; i++) {
        const angle = (Math.PI * 2 * i) / 12;
        const speed = 3 + Math.random() * 5.5;
        particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 2, life: 40, emoji });
      }
    }

    const input = { left: false, right: false };
    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = true;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = true;
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') jump();
      if (e.code === 'KeyE' || e.code === 'Enter') sillyParty();
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = false;
    });

    const bindHold = (id, key) => {
      const el = document.getElementById(id);
      el.addEventListener('pointerdown', (e) => { e.preventDefault(); input[key] = true; });
      el.addEventListener('pointerup', () => { input[key] = false; });
      el.addEventListener('pointerleave', () => { input[key] = false; });
    };
    bindHold('btn-left', 'left');
    bindHold('btn-right', 'right');

    function jump() {
      player.vy = -17.5;
      KidShell.sfx.boing();
      burst(player.x, player.y + 40, '💨');
    }

    function sillyParty() {
      hatIdx = (hatIdx + 1) % hats.length;
      player.vy = -15;
      KidShell.sfx.silly();
      burst(player.x, player.y, '🌈');
      KidShell.say('New silly hat!');
    }

    document.getElementById('btn-jump').addEventListener('pointerdown', (e) => { e.preventDefault(); jump(); });
    document.getElementById('btn-silly').addEventListener('pointerdown', (e) => { e.preventDefault(); sillyParty(); });

    let t = 0;
    function loop() {
      requestAnimationFrame(loop);
      t += 0.06;

      // Warm Cream Studio Paper Backdrop
      const bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, '#FCF8EB');
      bg.addColorStop(1, '#F2E8D2');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // Soft decorative clay clouds
      ctx.fillStyle = 'rgba(255, 253, 246, 0.85)';
      [0.2, 0.55, 0.85].forEach((cx, i) => {
        const x = ((cx * W + t * (4 + i * 2)) % (W + 160)) - 80;
        const y = 120 + i * 48;
        ctx.beginPath();
        ctx.arc(x, y, 36, 0, Math.PI * 2);
        ctx.arc(x + 30, y - 10, 42, 0, Math.PI * 2);
        ctx.arc(x + 62, y, 32, 0, Math.PI * 2);
        ctx.fill();
      });

      // Tactile Painted Wooden Jump Blocks
      pads.forEach((p) => {
        const px = p.x * W;
        const py = p.y * H;
        ctx.fillStyle = p.deep;
        ctx.beginPath(); ctx.roundRect(px - p.w / 2, py + 7, p.w, 26, 14); ctx.fill();
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.roundRect(px - p.w / 2, py, p.w, 26, 14); ctx.fill();

        if (
          player.vy > 0 &&
          player.x > px - p.w / 2 - 20 &&
          player.x < px + p.w / 2 + 20 &&
          player.y + player.radius > py &&
          player.y + player.radius < py + 34
        ) {
          player.vy = -19;
          KidShell.sfx.boing();
          burst(player.x, py, '✨');
        }
      });

      // Warm Forest-Green Felt Floor
      const groundY = H - 86;
      ctx.fillStyle = '#5c946e';
      ctx.fillRect(0, groundY, W, 86);
      ctx.fillStyle = '#3D7A52';
      ctx.fillRect(0, groundY, W, 12);

      if (input.left) player.vx = -9;
      else if (input.right) player.vx = 9;
      else player.vx *= 0.84;

      player.x += player.vx;
      player.vy += 0.65;
      player.y += player.vy;

      if (player.x < 55) player.x = 55;
      if (player.x > W - 55) player.x = W - 55;
      if (player.y > groundY - player.radius) {
        player.y = groundY - player.radius;
        player.vy = 0;
      }

      // Sunshine Stars
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let i = stars.length - 1; i >= 0; i--) {
        const s = stars[i];
        const sy = s.y + Math.sin(t + s.bob) * 10;
        ctx.font = `${s.size}px serif`;
        ctx.fillText('⭐', s.x, sy);

        if (Math.hypot(player.x - s.x, player.y - sy) < 82) {
          stars.splice(i, 1);
          score++;
          scoreEl.textContent = score;
          KidShell.sfx.coin();
          burst(s.x, sy, '🌟');
          if (score > best) {
            best = score;
            bestEl.textContent = best;
            KidShell.save('2d_best_stars', best);
          }
          if (score % 5 === 0) KidShell.say(`${score} stars! Approved by the 4 year old!`);
          spawnStar();
        }
      }

      // Soft-shadowed Clay Dino Portrait Token
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(player.vx * 0.025);
      ctx.shadowColor = 'rgba(74, 56, 38, 0.28)';
      ctx.shadowBlur = 16;
      ctx.shadowOffsetY = 8;
      ctx.beginPath();
      ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#FFFDF6';
      ctx.fill();
      ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

      ctx.beginPath();
      ctx.arc(0, 0, player.radius - 4, 0, Math.PI * 2);
      ctx.closePath();
      ctx.save();
      ctx.clip();
      if (mascotImg.complete && mascotImg.naturalWidth > 0) {
        ctx.drawImage(mascotImg, -player.radius, -player.radius, player.radius * 2, player.radius * 2);
      } else {
        ctx.fillStyle = '#F5C84C';
        ctx.fill();
      }
      ctx.restore();

      if (hats[hatIdx]) {
        ctx.font = '44px serif';
        ctx.fillText(hats[hatIdx], 0, -player.radius - 16);
      }
      ctx.restore();

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life--;
        ctx.globalAlpha = Math.max(0, p.life / 40);
        ctx.font = '26px serif';
        ctx.fillText(p.emoji, p.x, p.y);
        ctx.globalAlpha = 1;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }
    loop();
  </script>
</body>
</html>
